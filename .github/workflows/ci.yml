name: CI

# PR / branch push: build check.
# Push to main: also publish images to ghcr.io (tag sha-<7 chars>).
# Never deploys - production is deployed from the DigitalFUHub repo.
on:
  pull_request:
  push:
    branches: [main, "2026/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore DigitalFUHub.sln

      - name: Build
        run: dotnet build DigitalFUHub.sln -c Release --no-restore

      # No test projects yet - add `dotnet test` here when they exist

  publish:
    needs: build
    # Push to main, or a manual "Run workflow" on main
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: digitalfuhub-api
            dockerfile: Dockerfile
          - image: digitalfuhub-migrator
            dockerfile: Dockerfile.migrator
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "ref=ghcr.io/${OWNER,,}/${{ matrix.image }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image (report only)
        uses: aquasecurity/trivy-action@0.28.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.meta.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Summary
        run: echo "Published \`${{ steps.meta.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
